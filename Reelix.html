<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090711"><title>Reelix — видео</title>
<style>
:root{color-scheme:dark;--bg:#090711;--panel:#171323;--muted:#aaa2b8;--pink:#ff3d8b;--purple:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{max-width:520px;margin:auto;min-height:100dvh;background:#0d0a16;position:relative;padding-bottom:74px}.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#0d0a16ed;backdrop-filter:blur(14px);z-index:5;border-bottom:1px solid #ffffff10}.logo{font-weight:900;font-size:23px;letter-spacing:-1px;background:linear-gradient(90deg,#ff4c9a,#a78bfa);background-clip:text;color:transparent}.top button,.tab{background:transparent;padding:9px;color:#ddd}.tabs{display:flex;justify-content:center;gap:28px;height:43px;align-items:center}.tabs button{background:none;color:#aaa;font-weight:700}.tabs button.active{color:#fff;border-bottom:2px solid var(--pink)}.feed{height:calc(100dvh - 173px);min-height:430px;overflow:auto;scroll-snap-type:y mandatory}.post{height:100%;min-height:430px;max-height:820px;position:relative;scroll-snap-align:start;background:#171323;display:flex;align-items:center;justify-content:center;overflow:hidden}.post video{width:100%;height:100%;object-fit:contain;background:#050407}.empty{padding:35px;text-align:center;color:var(--muted)}.overlay{position:absolute;inset:auto 0 0;padding:60px 16px 20px;background:linear-gradient(transparent,#000b 75%);pointer-events:none}.overlay>*{pointer-events:auto}.author{font-weight:800;margin-bottom:7px}.desc{max-width:80%;line-height:1.35}.actions{position:absolute;right:12px;bottom:100px;display:grid;gap:17px;text-align:center}.actions button{background:#16121caa;border-radius:30px;padding:10px 8px;font-size:21px}.actions small{display:block;font-size:11px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;padding-bottom:env(safe-area-inset-bottom);background:#100d19;border-top:1px solid #ffffff15;display:flex;justify-content:space-around;align-items:center;z-index:8}.nav button{background:none;color:#b9b1c5;font-size:12px;display:grid;justify-items:center;gap:3px}.nav b{font-size:22px}.nav button.active{color:#ff5b9f}.page{padding:18px;display:none}.page.active{display:block}.field{width:100%;background:#211b2d;border:1px solid #3b304d;border-radius:12px;padding:13px;color:white;margin:7px 0 14px}.primary{background:linear-gradient(100deg,#f43f8c,#8b5cf6);border-radius:12px;padding:13px 18px;font-weight:800;width:100%;margin:8px 0}.secondary{background:#282135;border-radius:10px;padding:10px 14px}.card{background:var(--panel);padding:16px;border-radius:16px;margin:12px 0}.muted{color:var(--muted)}.profilehead{display:flex;align-items:center;gap:15px}.avatar{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#ff4d9b,#7954ef);display:grid;place-items:center;font-size:27px;font-weight:900}.stats{display:flex;gap:24px;margin:18px 0}.stats strong{display:block;font-size:20px}.videoitem{display:flex;gap:12px;align-items:center;border-bottom:1px solid #ffffff14;padding:10px 0}.videoitem video{width:65px;height:90px;object-fit:cover;background:#000;border-radius:8px}.comment{padding:10px 0;border-bottom:1px solid #ffffff15}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:end;justify-content:center}.modal.open{display:flex}.sheet{background:#171323;width:min(520px,100%);padding:20px;border-radius:22px 22px 0 0;max-height:80dvh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet textarea{min-height:70px;resize:vertical}#toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#30263d;padding:10px 16px;border-radius:20px;display:none;z-index:30;white-space:nowrap}
</style></head>
<body><div class="app">
<header class="top"><div class="logo">REELIX</div><button id="uploadTop">＋ Видео</button></header>
<div class="tabs"><button class="active" data-feed="forYou">Для вас</button><button data-feed="following">Подписки</button></div>
<main id="feed" class="feed"></main>
<section id="profile" class="page">
<div class="profilehead"><div class="avatar" id="avatar">R</div><div><h2 id="profileName" style="margin:0">Мой профиль</h2><div class="muted" id="handle">@reelix_user</div></div></div>
<div class="stats"><div><strong id="videoCount">0</strong><span class="muted">видео</span></div><div><strong id="likeCount">0</strong><span class="muted">лайков</span></div></div>
<input class="field" id="nameInput" placeholder="Твоё имя"><input class="field" id="bioInput" placeholder="О себе"><button class="primary" id="saveProfile">Сохранить профиль</button>
<h3>Мои видео</h3><div id="myVideos"></div></section>
<section id="search" class="page"><h2>Поиск</h2><input class="field" id="searchInput" placeholder="Найти видео или автора"><div id="searchResults"></div></section>
<section id="inbox" class="page"><h2>Сообщения</h2><p class="muted">Личные заметки на этом устройстве.</p><input class="field" id="chatName" placeholder="Имя собеседника"><div id="chatLog" class="card"></div><textarea class="field" id="chatText" placeholder="Сообщение"></textarea><button class="primary" id="sendChat">Отправить</button></section>
<section id="upload" class="page"><h2>Новое видео</h2><div class="card"><p class="muted">Выбери видео с телефона. Оно сохранится только в этом браузере.</p><input class="field" type="file" id="videoFile" accept="video/*"><input class="field" id="caption" maxlength="180" placeholder="Описание видео"><button class="primary" id="publish">Опубликовать видео</button></div></section>
<nav class="nav"><button class="active" data-page="home"><b>⌂</b>Главная</button><button data-page="search"><b>⌕</b>Поиск</button><button data-page="upload"><b>⊕</b>Добавить</button><button data-page="inbox"><b>✉</b>Входящие</button><button data-page="profile"><b>◉</b>Профиль</button></nav>
</div><div id="modal" class="modal"><div class="sheet"><div class="sheethead"><h3>Комментарии</h3><button id="closeModal" class="secondary">Закрыть</button></div><div id="comments"></div><textarea id="commentText" class="field" placeholder="Напиши комментарий"></textarea><button id="sendComment" class="primary">Отправить</button></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);let db,posts=[],current=0,commentPost=null,feedMode='forYou',profile={name:'Мой профиль',bio:''},chats={};
const request=indexedDB.open('reelix-local-v1',1);
request.onupgradeneeded=()=>{const d=request.result;if(!d.objectStoreNames.contains('videos'))d.createObjectStore('videos',{keyPath:'id'});};
request.onsuccess=()=>{db=request.result;loadPosts()};
function notify(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
function store(mode,fn){const tx=db.transaction('videos',mode);fn(tx.objectStore('videos'))}
function loadPosts(){store('readonly',s=>{const r=s.getAll();r.onsuccess=()=>{posts=r.result.sort((a,b)=>b.created-a.created);render();renderProfile()}})}
function render(){const list=feedMode==='following'?posts.filter(p=>p.followed):posts;const root=$('#feed');if(!list.length){root.innerHTML='<div class="empty"><h2>Твоя лента начинается здесь ✨</h2><p>Добавь первое видео и оно появится здесь.</p><button class="primary" onclick="go(\'upload\')">＋ Добавить видео</button></div>';return}
root.innerHTML=list.map((p,i)=>'<article class="post" data-id="'+p.id+'"><video src="'+p.url+'" controls playsinline loop '+(i===0?'autoplay':'')+'></video><div class="overlay"><div class="author">@'+esc(p.author||'reelix_user')+'</div><div class="desc">'+esc(p.caption||'')+'</div><div class="muted" style="margin-top:8px">♪ оригинальный звук</div></div><div class="actions"><button data-like="'+p.id+'">'+(p.liked?'❤️':'🤍')+'<small>'+p.likes+'</small></button><button data-comment="'+p.id+'">💬<small>'+p.comments.length+'</small></button><button data-follow="'+p.id+'">'+(p.followed?'✓':'＋')+'<small>Подписка</small></button></div></article>').join('');
root.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{const p=posts.find(x=>x.id===b.dataset.like);p.liked=!p.liked;p.likes+=p.liked?1:-1;save(p)});
root.querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>openComments(b.dataset.comment));
root.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>{const p=posts.find(x=>x.id===b.dataset.follow);p.followed=!p.followed;save(p)});
root.querySelectorAll('video').forEach(v=>v.onplay=()=>root.querySelectorAll('video').forEach(other=>{if(other!==v)other.pause()}));
}
function save(p){store('readwrite',s=>s.put(p));render();renderProfile()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openComments(id){commentPost=id;const p=posts.find(x=>x.id===id);$('#comments').innerHTML=p.comments.map(c=>'<div class="comment"><b>'+esc(c.author)+'</b><div>'+esc(c.text)+'</div></div>').join('')||'<p class="muted">Пока нет комментариев.</p>';$('#modal').classList.add('open')}
$('#closeModal').onclick=()=>$('#modal').classList.remove('open');
$('#sendComment').onclick=()=>{const t=$('#commentText').value.trim();if(!t)return;const p=posts.find(x=>x.id===commentPost);p.comments.push({author:profile.name,text:t});$('#commentText').value='';save(p);openComments(commentPost)};
$('#publish').onclick=()=>{const f=$('#videoFile').files[0];if(!f)return notify('Сначала выбери видео');if(!f.type.startsWith('video/'))return notify('Нужен видеофайл');const p={id:crypto.randomUUID(),url:URL.createObjectURL(f),blob:f,caption:$('#caption').value,author:profile.name||'reelix_user',created:Date.now(),likes:0,liked:false,followed:false,comments:[]};store('readwrite',s=>{s.put(p);setTimeout(loadPosts,100)});$('#videoFile').value='';$('#caption').value='';go('home');notify('Видео добавлено!')};
function renderProfile(){$('#profileName').textContent=profile.name;$('#avatar').textContent=(profile.name[0]||'R').toUpperCase();$('#nameInput').value=profile.name;$('#bioInput').value=profile.bio;$('#videoCount').textContent=posts.length;$('#likeCount').textContent=posts.reduce((a,p)=>a+p.likes,0);$('#myVideos').innerHTML=posts.map(p=>'<div class="videoitem"><video src="'+p.url+'" muted></video><div style="flex:1">'+esc(p.caption||'Видео')+'<div class="muted">❤️ '+p.likes+'</div></div><button class="secondary" data-delete="'+p.id+'">Удалить</button></div>').join('')||'<p class="muted">Ты ещё не публиковал видео.</p>';$('#myVideos').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{store('readwrite',s=>s.delete(b.dataset.delete));setTimeout(loadPosts,100);notify('Видео удалено')})}
$('#saveProfile').onclick=()=>{profile={name:$('#nameInput').value.trim()||'Мой профиль',bio:$('#bioInput').value};localStorage.setItem('reelix-profile',JSON.stringify(profile));renderProfile();notify('Профиль сохранён')};
try{profile={...profile,...JSON.parse(localStorage.getItem('reelix-profile')||'{}')}}catch(e){}
function go(page){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('#feed').style.display=page==='home'?'block':'none';if(page!=='home')$('#'+page).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='profile')renderProfile();if(page==='search')search()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
$('#uploadTop').onclick=()=>go('upload');
document.querySelectorAll('[data-feed]').forEach(b=>b.onclick=()=>{feedMode=b.dataset.feed;document.querySelectorAll('[data-feed]').forEach(x=>x.classList.toggle('active',x===b));render()});
function search(){const q=$('#searchInput').value.toLowerCase();const found=posts.filter(p=>(p.caption+' '+p.author).toLowerCase().includes(q));$('#searchResults').innerHTML=found.map(p=>'<div class="card"><b>@'+esc(p.author)+'</b><p>'+esc(p.caption)+'</p><span class="muted">❤️ '+p.likes+' · '+p.comments.length+' комментариев</span></div>').join('')||'<p class="muted">Ничего не найдено.</p>'}
$('#searchInput').oninput=search;
function renderChat(){const n=$('#chatName').value.trim()||'Собеседник';$('#chatLog').innerHTML=(chats[n]||[]).map(m=>'<p><b>'+esc(m.me?'Я':n)+':</b> '+esc(m.text)+'</p>').join('')||'<span class="muted">Здесь пока пусто.</span>'}
$('#chatName').oninput=renderChat;$('#sendChat').onclick=()=>{const n=$('#chatName').value.trim(),t=$('#chatText').value.trim();if(!n||!t)return notify('Укажи имя и сообщение');(chats[n]??=[]).push({me:true,text:t});localStorage.setItem('reelix-chats',JSON.stringify(chats));$('#chatText').value='';renderChat()};
try{chats=JSON.parse(localStorage.getItem('reelix-chats')||'{}')}catch(e){}
renderChat();
</script></body></html>
